name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.0.1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure scripts executable
        run: |
          chmod +x scripts/*.sh || true

      - name: Build firmware
        run: |
          idf.py build

      - name: Build All Apps
        run: |
          set -e
          mkdir -p build/apps

          # Generate OS symbol table
          scripts/gen_symtab.sh build/esposito.elf build/os_symbols.ld

          # Build each app
          for app_dir in apps/*/; do
              if [ -f "${app_dir}app.c" ]; then
                  scripts/build_app.sh "${app_dir}app.c" build/apps
              fi
          done

      - name: Package apps for artifact
        run: |
          set -e
          mkdir -p build/package/apps
          shopt -s nullglob

          for app_elf in build/apps/*.elf; do
              app_name=$(basename "$app_elf" .elf)
              mkdir -p "build/package/apps/${app_name}"
              cp "$app_elf" "build/package/apps/${app_name}/program.elf"

              manifest="apps/${app_name}/manifest.cfg"
              if [ -f "$manifest" ]; then
                  cp "$manifest" "build/package/apps/${app_name}/manifest.cfg"
              fi
          done

      - name: Prepare artifact layout
        run: |
          mkdir -p system
          cp build/esposito.bin system/firmware.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-and-apps
          path: |
            system/firmware.bin
            build/package/apps/**
            fonts/*.fpack